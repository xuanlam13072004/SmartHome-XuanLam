name: smarthome_app
description: "SmartHome XuanLam — Ứng dụng điều khiển nhà thông minh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^16.1.0
  lucide_icons: ^0.257.0
  dio: ^5.10.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.3.1
  mobile_scanner: ^6.0.11
  # Camera HLS on Android / iOS (ExoPlayer / AVPlayer); the web app uses hls.js.
  video_player: ^2.9.2
  # Voice profile recordings: 16 kHz mono PCM stream (Cá nhân → Giọng nói).
  record: ^6.0.0
  # Reads the assistant's replies aloud (Vietnamese voice of the phone).
  flutter_tts: ^4.2.0
  # VietQR payment codes (Gói dịch vụ → Thanh toán).
  qr_flutter: ^4.1.0
  # Push notifications when the app is closed (docs/architecture/push.md).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  generate: true  # Enables l10n code generation
