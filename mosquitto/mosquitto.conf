# SmartHome MQTT broker (Mosquitto 2.1, Dynamic Security).
# Contract: docs/architecture/mqtt-security.md
#
# Every client must authenticate. Devices log in with username = MAC and may
# only use smarthome/<their MAC>/... topics. TLS is not enabled yet: keep the
# broker on a trusted LAN until a TLS listener is added.

per_listener_settings false

listener 1883
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Retained topology assignments survive broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
