# Metrics of the SmartHome services (docs/architecture/load-testing.md).
# Each service serves /metrics on its own port inside the Docker network;
# none of these ports is published or reachable through the tunnel.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9101"]
  - job_name: real-time-service
    static_configs:
      - targets: ["real-time-service:9102"]
  - job_name: mqtt-worker-service
    static_configs:
      - targets: ["mqtt-worker-service:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
