name: smarthome-device-simulator

# The Simulator has no web page of its own: it is the "Simulator" section of
# the Admin Console (admin-console/, docs/architecture/admin.md), which signs
# staff in, checks their permission and calls this backend with ADMIN_TOKEN.

services:
  simulator-backend:
    build:
      context: ./backend
    container_name: simulator-backend
    env_file:
      - path: .env.docker
        required: false
    environment:
      # Virtual SD card of the virtual cameras (camera contract, section 9).
      SIMULATOR_MEDIA_ROOT: /var/lib/simulator-media
    volumes:
      - "${SIMULATOR_MEDIA_HOST_DIR:-E:/smarthome_data/device-simulator/media}:/var/lib/simulator-media"
    # Only the Admin Console (root stack, same Docker network) uses this API;
    # the port is published on this computer alone, for debugging.
    ports:
      - "127.0.0.1:4001:4001"
    # One MQTT connection per directly connected virtual device.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - smarthome_net
    restart: unless-stopped

networks:
  smarthome_net:
    external: true
    name: ${SMARTHOME_DOCKER_NETWORK:-smarthome-xuanlam_smarthome_net}
