
networks:
  smarthome_net:
    driver: bridge
  # Camera video leaves the house only through the tunnel's private network
  # route (Cloudflare WARP). This small network gives the media relay the fixed
  # address of that route, 10.250.0.2 (cloudflared/config.yml).
  media_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.0.0/29

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - "E:/smarthome_data/postgresql:/var/lib/postgresql"
    ports:
      # Only this computer (database tools); containers use postgres:5432.
      - "127.0.0.1:5433:5432"
    networks:
      - smarthome_net
    healthcheck:
      # Check over TCP: on a fresh data folder the image first runs a temporary,
      # socket-only server to create the database, which a plain pg_isready
      # reports as ready before the real server listens.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d smarthome" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - smarthome_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      # Only this computer (database tools); containers use mongodb:27017.
      - "127.0.0.1:27017:27017"
    volumes:
      - "E:/smarthome_data/mongodb:/data/db"
      - "E:/smarthome_data/mongodb-config:/data/configdb"
    networks:
      - smarthome_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5


  mosquitto:
    # 2.1+ is required: Dynamic Security %u ACL patterns (docs/architecture/mqtt-security.md).
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    environment:
      # Applied only when dynamic-security.json is created for the first time.
      MOSQUITTO_DYNSEC_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in the root .env (see .env.example)}
    ports:
      - "1883:1883"
    # Each device holds its own MQTT session; tens of thousands of sockets.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - "E:/smarthome_data/mosquitto:/mosquitto/data"
    networks:
      - smarthome_net
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -u admin -P \"$$MOSQUITTO_DYNSEC_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 5 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt-initialize:
    # Idempotent: creates broker roles/ACLs and the worker/factory identities.
    build:
      context: .
      dockerfile: mqtt-worker-service/Dockerfile
    container_name: mqtt-initialize
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in the root .env}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD:?Set MQTT_WORKER_PASSWORD in the root .env}
      MQTT_FACTORY_PASSWORD: ${MQTT_FACTORY_PASSWORD:?Set MQTT_FACTORY_PASSWORD in the root .env}
    command: [ "node", "src/tools/initializeBroker.js" ]
    networks:
      - smarthome_net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

  db-initialize:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: db-initialize
    env_file:
      - api-gateway/.env.docker
    environment:
      ALLOW_V2_DATABASE_INITIALIZATION: "true"
      ALLOW_CATALOG_PUBLISH: "true"
      NODE_PATH: "/app/api-gateway/node_modules"
    command: [ "node", "/app/database/initialize_v2.js" ]
    networks:
      - smarthome_net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - api-gateway/.env.docker
    environment:
      # Camera media (docs/architecture/camera-contract.md). The public URL is
      # what the app's HLS player opens; the ingest URL is what cameras dial.
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:8090}
      MEDIA_INGEST_URL: ${MEDIA_INGEST_URL:-ws://media-relay-service:8090/v1/ingest}
      # Requests arrive through Cloudflare Tunnel: take the visitor's address from
      # X-Forwarded-For when it comes from this computer or Docker (api-gateway
      # src/config/trustProxy.ts). Set TRUST_PROXY= (empty) if PUBLISH_HOST opens the LAN.
      TRUST_PROXY: ${TRUST_PROXY-loopback,linklocal,uniquelocal}
      # Voice verification (docs/architecture/voice.md); shared with voice-service.
      VOICE_SERVICE_URL: http://voice-service:8000
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN:?Set VOICE_SERVICE_TOKEN in the root .env (see .env.example)}
      # Assistant (docs/architecture/assistant.md). Empty key = assistant off (503).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL-low}
      # Payments (docs/architecture/payments.md). mock = no real money (testing);
      # bank = VietQR to the account below, confirmed by the SePay webhook or by hand.
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      PAYMENT_BANK_BIN: ${PAYMENT_BANK_BIN:-}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-}
      PAYMENT_ACCOUNT_NAME: ${PAYMENT_ACCOUNT_NAME:-}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      # Push notifications (docs/architecture/push.md): the Firebase service account
      # JSON in ./secrets (Git-ignored). Missing file = push off.
      FCM_SERVICE_ACCOUNT_FILE: /run/smarthome-secrets/firebase-service-account.json
      # Administration API, called only by the Admin Console (docs/architecture/admin.md),
      # which gets the same variable. Empty = off.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - ./secrets:/run/smarthome-secrets:ro
    ports:
      # 127.0.0.1: reached through Cloudflare Tunnel (cloudflared on this computer)
      # and the Android emulator; PUBLISH_HOST=0.0.0.0 opens it to the LAN.
      - "${PUBLISH_HOST:-127.0.0.1}:3000:3000"
    networks:
      - smarthome_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully

  # Voice verification (docs/architecture/voice.md): only the API Gateway calls it.
  voice-service:
    build:
      context: ./voice-service
    container_name: voice-service
    environment:
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN:?Set VOICE_SERVICE_TOKEN in the root .env (see .env.example)}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: smarthome
      PG_USER: postgres
      PG_PASSWORD: postgres
      # Recordings judged at the same time (each uses about one CPU core).
      VOICE_MAX_CONCURRENCY: ${VOICE_MAX_CONCURRENCY:-2}
    volumes:
      # cohort.npy for score normalization (python -m tools.build_cohort).
      - "E:/smarthome_data/voice:/data"
    networks:
      - smarthome_net
    depends_on:
      postgres:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully
    restart: unless-stopped

  media-relay-service:
    build:
      context: .
      dockerfile: media-relay-service/Dockerfile
    container_name: media-relay-service
    environment:
      PORT: 8090
      REDIS_URL: redis://redis:6379
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:8090:8090"
    networks:
      smarthome_net:
      media_net:
        ipv4_address: 10.250.0.2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  real-time-service:
    build:
      context: .
      dockerfile: real-time-service/Dockerfile
    container_name: real-time-service
    env_file:
      - real-time-service/.env.docker
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:3001:3001"
    networks:
      - smarthome_net
    depends_on:
      # WebSocket auth verifies account status/token_version through the Gateway.
      api-gateway:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully

  mqtt-worker-service:
    build:
      context: .
      dockerfile: mqtt-worker-service/Dockerfile
    container_name: mqtt-worker-service
    env_file:
      - mqtt-worker-service/.env.docker
    environment:
      MQTT_USERNAME: mqtt-worker-service
      MQTT_PASSWORD: ${MQTT_WORKER_PASSWORD:?Set MQTT_WORKER_PASSWORD in the root .env}
    networks:
      - smarthome_net
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mqtt-initialize:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully

  # Cloudflare Tunnel (docs/cloudflare-tunnel.md): api-datn / ws-datn public
  # hostnames and the private route to the media relay for WARP phones.
  # The company's Admin Console (docs/architecture/admin.md): staff sign in here;
  # it calls the API Gateway's /admin API and the Device Simulator for them.
  # 127.0.0.1: this computer only; ADMIN_CONSOLE_HOST=0.0.0.0 opens it to the LAN.
  # Never routed through Cloudflare Tunnel.
  admin-console:
    build:
      context: ./admin-console
    container_name: admin-console
    environment:
      GATEWAY_URL: http://api-gateway:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SIMULATOR_URL: http://simulator-backend:4001
      # The Simulator's ADMIN_TOKEN (device-simulator/.env.docker); empty = no Simulator section.
      SIMULATOR_TOKEN: ${SIMULATOR_ADMIN_TOKEN:-}
      COOKIE_SECURE: ${ADMIN_CONSOLE_COOKIE_SECURE:-false}
    ports:
      - "${ADMIN_CONSOLE_HOST:-127.0.0.1}:4000:4000"
    networks:
      - smarthome_net
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    container_name: cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel's secret stays outside the project, e.g.
      # C:/Users/<you>/.cloudflared/<tunnel-id>.json (root .env).
      - ${CLOUDFLARED_CREDENTIALS_FILE:-./cloudflared/credentials.json}:/etc/cloudflared/credentials.json:ro
    networks:
      - smarthome_net
      - media_net
    depends_on:
      - api-gateway
      - real-time-service
      - media-relay-service
    restart: unless-stopped

  # Load testing (docs/architecture/load-testing.md), only with
  # `docker compose --profile monitoring up -d`: Prometheus reads each service's
  # /metrics (ports 9100–9102 inside the Docker network, never published) and
  # Grafana shows the ready-made dashboard at http://localhost:3005.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - smarthome_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    profiles: ["monitoring"]
    environment:
      # Read-only without signing in (published on this computer only).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smarthome.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3005:3000"
    networks:
      - smarthome_net
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
