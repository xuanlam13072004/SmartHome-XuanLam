
networks:
  smarthome_net:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - "E:/smarthome_data/postgresql:/var/lib/postgresql"
    ports:
      - "5433:5432"
    networks:
      - smarthome_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - smarthome_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - "E:/smarthome_data/mongodb:/data/db"
      - "E:/smarthome_data/mongodb-config:/data/configdb"
    networks:
      - smarthome_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5


  mosquitto:
    # 2.1+ is required: Dynamic Security %u ACL patterns (docs/architecture/mqtt-security.md).
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    environment:
      # Applied only when dynamic-security.json is created for the first time.
      MOSQUITTO_DYNSEC_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in the root .env (see .env.example)}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - "E:/smarthome_data/mosquitto:/mosquitto/data"
    networks:
      - smarthome_net
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -u admin -P \"$$MOSQUITTO_DYNSEC_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 5 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt-initialize:
    # Idempotent: creates broker roles/ACLs and the worker/factory identities.
    build:
      context: .
      dockerfile: mqtt-worker-service/Dockerfile
    container_name: mqtt-initialize
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in the root .env}
      MQTT_WORKER_PASSWORD: ${MQTT_WORKER_PASSWORD:?Set MQTT_WORKER_PASSWORD in the root .env}
      MQTT_FACTORY_PASSWORD: ${MQTT_FACTORY_PASSWORD:?Set MQTT_FACTORY_PASSWORD in the root .env}
    command: [ "node", "src/tools/initializeBroker.js" ]
    networks:
      - smarthome_net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

  db-initialize:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: db-initialize
    env_file:
      - api-gateway/.env.docker
    environment:
      ALLOW_V2_DATABASE_INITIALIZATION: "true"
      ALLOW_CATALOG_PUBLISH: "true"
      NODE_PATH: "/app/api-gateway/node_modules"
    command: [ "node", "/app/database/initialize_v2.js" ]
    networks:
      - smarthome_net
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - api-gateway/.env.docker
    ports:
      - "3000:3000"
    networks:
      - smarthome_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully

  real-time-service:
    build:
      context: .
      dockerfile: real-time-service/Dockerfile
    container_name: real-time-service
    env_file:
      - real-time-service/.env.docker
    ports:
      - "3001:3001"
    networks:
      - smarthome_net
    depends_on:
      # WebSocket auth verifies account status/token_version through the Gateway.
      api-gateway:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully

  mqtt-worker-service:
    build:
      context: .
      dockerfile: mqtt-worker-service/Dockerfile
    container_name: mqtt-worker-service
    env_file:
      - mqtt-worker-service/.env.docker
    environment:
      MQTT_USERNAME: mqtt-worker-service
      MQTT_PASSWORD: ${MQTT_WORKER_PASSWORD:?Set MQTT_WORKER_PASSWORD in the root .env}
    networks:
      - smarthome_net
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mqtt-initialize:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      db-initialize:
        condition: service_completed_successfully
