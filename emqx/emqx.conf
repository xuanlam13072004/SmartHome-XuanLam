## SmartHome MQTT broker: EMQX 5.8, one node.
## Contract: docs/architecture/mqtt-security.md.
##
## Every client logs in with an account from PostgreSQL (table mqtt_accounts,
## read through the read-only role emqx_auth): a device with username = its
## MAC, the backend as mqtt-worker-service. Adding a device adds one row;
## nothing here is rewritten when devices come and go.
## Permissions are in acl.conf: a device only reaches smarthome/<its MAC>/...
##
## No secret is written in this file: docker-compose.yml passes them as
## environment variables from the root .env: the database password
## (EMQX_AUTHENTICATION__1__PASSWORD), the first dashboard password
## (EMQX_DASHBOARD__DEFAULT_PASSWORD) and the node cookie (EMQX_NODE__COOKIE,
## which guards the Erlang distribution port inside the Docker network).
## Precedence: base.hocon < cluster.hocon < emqx.conf < environment variables,
## so changes made in the dashboard never override what is set here.

node {
  ## One node, no cluster: a fixed name keeps the data directory valid across
  ## container restarts (the image would otherwise use the container's IP).
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = smarthome
  discovery_strategy = manual
}

dashboard {
  ## Published on 127.0.0.1 only (docker-compose.yml).
  listeners.http.bind = 18083
  default_username = "admin"
}

## Plain MQTT for devices and services. TLS is not enabled yet: keep port 1883
## on a trusted LAN (docs/architecture/mqtt-security.md, "Not covered yet").
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = infinity
}
listeners.ssl.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

authentication = [
  {
    mechanism = password_based
    backend = postgresql
    server = "postgres:5432"
    database = "smarthome"
    username = "emqx_auth"
    pool_size = 8
    ## ${username} is filled in by EMQX (a prepared statement), not by HOCON.
    query = "SELECT password_hash, salt FROM mqtt_accounts WHERE username = ${username} LIMIT 1"
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

authorization {
  no_match = deny
  ## A forbidden publish is dropped, a forbidden subscription refused; the
  ## connection stays (a device with an old topic list keeps working otherwise).
  deny_action = ignore
  cache {
    enable = true
    max_size = 32
    ttl = 1m
  }
  sources = [
    {
      type = file
      enable = true
      path = "${EMQX_ETC_DIR}/acl.conf"
    }
  ]
}

## Topology assignments (smarthome/<MAC>/topology) are retained: keep them on
## disk so a broker restart does not forget which Hub serves which Node.
retainer {
  enable = true
  backend {
    type = built_in_database
    storage_type = disc
  }
}

## Metrics for Prometheus at /api/v5/prometheus/stats (port 18083 inside the
## Docker network; docs/architecture/load-testing.md).
prometheus {
  enable_basic_auth = false
}
