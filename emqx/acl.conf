%% SmartHome MQTT permissions (docs/architecture/mqtt-security.md).
%% Rules are checked from the top; the first match decides. Anything not
%% allowed below is denied (emqx.conf: authorization.no_match = deny).

%% The backend (MQTT Worker): every SmartHome topic, shared subscriptions included.
{allow, {username, "mqtt-worker-service"}, all, ["smarthome/#"]}.

%% A device (username = its MAC): publishes only its own reports...
{allow, all, publish, [
    "smarthome/${username}/telemetry",
    "smarthome/${username}/events",
    "smarthome/${username}/ack",
    "smarthome/${username}/status",
    "smarthome/${username}/topology/ack"
]}.

%% ...and receives only its own commands and topology.
{allow, all, subscribe, [
    "smarthome/${username}/control",
    "smarthome/${username}/hub/control",
    "smarthome/${username}/topology"
]}.

{deny, all}.
